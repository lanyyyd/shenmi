plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

neoForge {
    version = project.neoforge_version
}

sourceSets {
    main {
        java.srcDir '../common/src/main/java'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_release as int
}

processResources {
    inputs.property 'mod_version', project.mod_version
    inputs.property 'mc_version', project.minecraft_version
    inputs.property 'neoforge_min', project.neoforge_min
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'mod_version': project.mod_version,
               'mc_version': project.minecraft_version,
               'neoforge_min': project.neoforge_min
    }
}

tasks.named('jar', Jar) {
    archiveFileName = "${project.archives_base_name}.jar"
}
