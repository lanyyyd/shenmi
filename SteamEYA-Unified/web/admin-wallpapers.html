<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-mode="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>壁纸库 · 管理后台</title>
<link rel="stylesheet" href="/css/style.css">
<style>
body{overflow:auto}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:26px 18px 60px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:21px;font-weight:800;letter-spacing:-.3px}
.top .spacer{flex:1}
.btn{padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;transition:.2s;
  background:var(--panel);border:1px solid var(--line);color:var(--text);cursor:pointer}
html[data-theme="light"] .btn:not(.pri){background:#fff}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.pri{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border:none}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.danger{color:#EF4444}
.btn.danger:hover{border-color:#EF4444}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  backdrop-filter:var(--panel-blur);-webkit-backdrop-filter:var(--panel-blur)}
html[data-theme="light"] .card{background:#fff;box-shadow:var(--shadow)}
.card-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:700}
.card-h .spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:16px}
.wall{background:var(--panel-soft);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.wall img{display:block;width:100%;height:130px;object-fit:cover;background:#222}
.wall .body{padding:10px 12px;display:flex;align-items:center;gap:8px}
.wall .name{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{font-size:12px;padding:5px 9px;border-radius:8px}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13.5px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px}
input[type=text]{padding:9px 12px;border-radius:9px;border:1.5px solid var(--line);
  background:var(--input-bg);color:var(--text);font-size:13.5px;min-width:220px}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#111;color:#fff;
  padding:10px 18px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.on{opacity:.94}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>壁纸库</h1>
  </div>

  <div class="card">
    <div class="card-h"><h2>上传壁纸</h2></div>
    <div class="row">
      <input type="file" id="wFile" accept=".png,.jpg,.jpeg,.gif,.webp,.bmp,image/*">
      <input type="text" id="wTitle" placeholder="标题（可留空，默认用文件名）" maxlength="60">
      <button class="btn pri" onclick="upload()">上传</button>
      <span style="font-size:12px;color:var(--muted)">支持 png / jpg / gif / webp / bmp，单张不超过 20MB</span>
    </div>
  </div>

  <div class="card" style="margin-top:18px">
    <div class="card-h"><h2>已上传</h2><div class="spacer"></div><span id="wCount" style="font-size:12px;color:var(--muted)"></span></div>
    <div class="grid" id="wGrid"></div>
  </div>
</div>
<div id="toast"></div>
<script src="/js/admin-nav.js"></script>
<script>
const $ = id => document.getElementById(id);
let ITEMS = [];

function toast(t){
  const el = $('toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('on'), 2000);
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(n){
  if(!n) return '';
  return n > 1024*1024 ? (n/1024/1024).toFixed(1)+' MB' : Math.round(n/1024)+' KB';
}

async function load(){
  const r = await fetch('/api/wallpapers');
  const d = await r.json().catch(()=>({}));
  ITEMS = d.wallpapers || [];
  $('wCount').textContent = ITEMS.length ? `共 ${ITEMS.length} 张` : '';
  $('wGrid').innerHTML = ITEMS.length ? ITEMS.map(w => `
    <div class="wall">
      <img src="${esc(w.url)}" loading="lazy" alt="">
      <div class="body">
        <div class="name" title="${esc(w.title)}">${esc(w.title || '未命名')}</div>
        <button class="btn mini" onclick="rename(${w.id})">改名</button>
        <button class="btn mini danger" onclick="remove(${w.id})">删除</button>
      </div>
    </div>`).join('') : '<div class="empty" style="grid-column:1/-1">还没有上传壁纸</div>';
}

async function upload(){
  const file = $('wFile').files[0];
  if(!file){ toast('请先选择图片'); return; }
  const fd = new FormData();
  fd.append('file', file);
  fd.append('title', $('wTitle').value.trim());
  const r = await fetch('/api/wallpapers/admin/upload', {method:'POST', body: fd});
  const d = await r.json().catch(()=>({}));
  if(!r.ok){ toast(d.detail || '上传失败'); return; }
  toast('已上传');
  $('wFile').value = ''; $('wTitle').value = '';
  load();
}

async function rename(id){
  const cur = ITEMS.find(x => x.id === id);
  const title = prompt('新的标题', cur ? cur.title : '');
  if(title === null) return;
  const r = await fetch('/api/wallpapers/admin/' + id, {
    method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({title})
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok){ toast(d.detail || '改名失败'); return; }
  toast('已保存'); load();
}

async function remove(id){
  if(!confirm('删除这张壁纸？已使用它的客户端不受影响。')) return;
  const r = await fetch('/api/wallpapers/admin/' + id, {method:'DELETE'});
  const d = await r.json().catch(()=>({}));
  if(!r.ok){ toast(d.detail || '删除失败'); return; }
  toast('已删除'); load();
}

load();
</script>
</body>
</html>
