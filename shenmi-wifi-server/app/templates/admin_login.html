<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神秘 WiFi - 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #16213e; border-radius: 16px; padding: 40px; width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .login-box h1 { text-align: center; margin-bottom: 30px; font-size: 24px; color: #4facfe; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #aaa; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px; background: #0f3460; color: #fff; font-size: 15px; }
        .form-group input:focus { outline: none; border-color: #4facfe; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:hover { opacity: 0.9; }
        .error { color: #e74c3c; text-align: center; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>神秘 WiFi 管理后台</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label>管理员账号</label>
                <input type="text" name="username" required placeholder="admin">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required placeholder="••••••">
            </div>
            <button type="submit" class="btn">登录</button>
        </form>
    </div>
</body>
</html>
