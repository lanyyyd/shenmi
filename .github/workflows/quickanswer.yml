name: Build QuickAnswer (Windows x64)

# 独立的构建流程：只监听 QuickAnswer/ 目录，不与主程序（SteamEyaWinUI）的 build.yml 互相触发，
# 发布 tag 用 qa-v 前缀，避免覆盖主程序的 v1.0.x Release。
on:
  push:
    branches: [ main, master ]
    paths:
      - 'QuickAnswer/**'
      - '.github/workflows/quickanswer.yml'
  pull_request:
    paths:
      - 'QuickAnswer/**'
      - '.github/workflows/quickanswer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # WinUI 3 / Windows App SDK 只能在 Windows 上编译
    runs-on: windows-latest
    env:
      PROJECT: QuickAnswer/src/QuickAnswer.App/QuickAnswer.App.csproj
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      # 固定英文 UI 文化：XAML 编译器报错时若找不到本地化资源，真实错误会被吞成 WMC9999
      DOTNET_CLI_UI_LANGUAGE: en-US
      VSLANG: '1033'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 主程序用 net10.0（net8.0 的 Native AOT 有 WinUI GC 挂死缺陷），这里保持一致
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 环境信息
        run: dotnet --info

      # 先普通编译：XAML/C# 有错能快速失败，不用等 publish 全程
      - name: Build (Release / x64)
        id: build
        continue-on-error: true
        run: dotnet build "$env:PROJECT" -c Release -p:Platform=x64

      # XAML 编译器 Pass2 失败只抛 WMC9999，真实错误在 output.json 里
      - name: 诊断 · 打印 XAML 编译器 output.json
        if: always()
        shell: pwsh
        run: |
          $projDir = Split-Path $env:PROJECT
          $files = Get-ChildItem -Path "$projDir\obj" -Recurse -Filter output.json -ErrorAction SilentlyContinue
          if ($files) {
            foreach ($f in $files) {
              Write-Host "===== $($f.FullName) ====="
              Get-Content $f.FullName -Raw
            }
          } else {
            Write-Host "未找到 output.json"
            if (Test-Path "$projDir\obj") {
              Get-ChildItem -Recurse "$projDir\obj" -Filter *.log | Select-Object -ExpandProperty FullName
            }
          }

      - name: 构建失败则终止
        if: steps.build.outcome != 'success'
        shell: pwsh
        run: |
          Write-Error "dotnet build 失败，见上方日志"
          exit 1

      # 自包含发布：把 Windows App SDK 运行时一起打进去，用户机器不需要装 Windows App Runtime。
      # 不用 Native AOT（体积换稳定，OCR 走 WinRT，AOT 下容易出玄学问题）。
      - name: Publish (self-contained / win-x64)
        shell: pwsh
        run: |
          $patch = [Math]::Max(0, ${{ github.run_number }})
          Write-Host "版本 1.0.$patch"
          dotnet publish "$env:PROJECT" -c Release -r win-x64 -p:Platform=x64 `
            -p:Version=1.0.$patch -o quickanswer-publish
          if (-not (Test-Path "quickanswer-publish\QuickAnswer.exe")) {
            Write-Host "发布目录内容："
            Get-ChildItem quickanswer-publish | Select-Object -ExpandProperty Name
            throw "QuickAnswer.exe 未生成"
          }

      - name: 清理符号与调试文件
        shell: pwsh
        run: |
          Get-ChildItem -Path quickanswer-publish -Filter *.pdb -File -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
          # WinAppSDK 自带的 XAML 调试后缀
          Get-ChildItem -Path quickanswer-publish -Filter *.pri.xml -File -ErrorAction SilentlyContinue | Remove-Item -Force

      - name: 体积诊断
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path quickanswer-publish)) { exit 0 }
          $files = Get-ChildItem quickanswer-publish -Recurse -File
          $total = ($files | Measure-Object Length -Sum).Sum
          Write-Host ("===== 合计 {0:N1} MB / {1} 个文件 =====" -f ($total/1MB), $files.Count)
          $files | Sort-Object Length -Descending | Select-Object -First 15 | ForEach-Object {
            Write-Host ("{0,8:N2} MB  {1}" -f ($_.Length/1MB), $_.Name)
          }

      - name: 打包便携版 zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path quickanswer-artifacts | Out-Null
          $patch = [Math]::Max(0, ${{ github.run_number }})
          $name = "QuickAnswer-1.0.$patch-win-x64"
          Compress-Archive -Path "quickanswer-publish\*" -DestinationPath "quickanswer-artifacts\$name.zip" -Force
          $size = (Get-Item "quickanswer-artifacts\$name.zip").Length / 1MB
          Write-Host ("便携包 {0} : {1:N1} MB" -f $name, $size)

      # 产物传 Release 附件，不占 Actions 存储配额（账号 500MB 已接近上限）
      - name: 发布到 GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $patch = [Math]::Max(0, ${{ github.run_number }})
          $tag = "qa-v1.0.$patch"
          $zip = Get-ChildItem quickanswer-artifacts/*.zip | Select-Object -First 1
          if (-not $zip) { throw "便携包未生成" }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "QuickAnswer $tag" --notes "自动构建 ${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败" }
          }
          gh release upload $tag $zip.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传失败" }
          Write-Host "Release: https://github.com/${{ github.repository }}/releases/tag/$tag"

      # 手动触发时额外留一份 Actions artifact，方便不进 Release 也能下
      - name: 上传构建产物
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: QuickAnswer-win-x64
          path: quickanswer-artifacts/*.zip
          retention-days: 7
