name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'SteamEYA-Unified/client/SteamEyaAndroid/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不用 android-actions/setup-android@v3：它会去装已下线的 "tools" 包，
      # 在 2026 的 runner 镜像上直接报 Failed to find package 'tools'。
      # ubuntu-latest 自带 Android SDK，这里只补平台与 licenses。
      - name: 配置 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK=$SDK"

          SM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager=$SM"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" --install "platform-tools" "platforms;android-37" "build-tools;37.0.0" || true
          fi
          echo "=== 已装平台 ==="
          ls "$SDK/platforms" 2>/dev/null || true
          echo "=== 已装 build-tools ==="
          ls "$SDK/build-tools" 2>/dev/null || true

      - name: Setup Gradle（仅用于缓存）
        uses: gradle/actions/setup-gradle@v4

      # 必须锁 Gradle 9.0：
      #   - runner 自带 9.8.1，而 Gradle 9.6 起移除了 AGP 8.x 依赖的
      #     org.gradle.api.problems.internal.InternalProblems，直接 "Failed to apply plugin"
      #   - 9.1~9.5 官方没有发布（distributions 全部 404），所以 9.0 是唯一可用版本
      - name: 安装 Gradle 9.0
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.0-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/.gradle-dist"
          echo "$HOME/.gradle-dist/gradle-9.0/bin" >> "$GITHUB_PATH"

      - name: 确认 Gradle 版本
        run: gradle --version

      - name: 还原签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # 没配密钥就跳过：build.gradle 会自动退回 debug 签名，APK 仍可安装调试。
          if [ -z "$KEYSTORE_B64" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64，本次使用 debug 签名"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 构建 Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: SteamEYA-Unified/client/SteamEyaAndroid
        run: |
          # 版本号与桌面端一致：1.0.<构建序号偏移>，安卓独立计数
          PATCH=$(( GITHUB_RUN_NUMBER ))
          echo "版本 1.0.$PATCH (code=$PATCH)"
          gradle :app:assembleRelease \
            -PappVersionName="1.0.$PATCH" \
            -PappVersionCode="$PATCH" \
            --no-daemon --stacktrace

      - name: 收集产物
        run: |
          mkdir -p out
          find SteamEYA-Unified/client/SteamEyaAndroid/app/build/outputs/apk/release -name "*.apk" -exec cp {} out/TeaTT-android.apk \;
          ls -lh out

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TeaTT-android-apk
          path: out/TeaTT-android.apk
          if-no-files-found: error

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PATCH=$(( GITHUB_RUN_NUMBER ))
          TAG="android-v1.0.$PATCH"
          cp out/TeaTT-android.apk "TeaTT-1.0.$PATCH-android.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "TeaTT-1.0.$PATCH-android.apk" --clobber
          else
            gh release create "$TAG" "TeaTT-1.0.$PATCH-android.apk" \
              --title "茶π·次元口袋 安卓 1.0.$PATCH" \
              --notes "安卓客户端构建产物（直接安装 APK）。"
          fi
