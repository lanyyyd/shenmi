name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'SteamEYA-Unified/client/SteamEyaAndroid/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: 还原签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # 没配密钥就跳过：build.gradle 会自动退回 debug 签名，APK 仍可安装调试。
          if [ -z "$KEYSTORE_B64" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64，本次使用 debug 签名"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 构建 Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: SteamEYA-Unified/client/SteamEyaAndroid
        run: |
          # 版本号与桌面端一致：1.0.<构建序号偏移>，安卓独立计数
          PATCH=$(( GITHUB_RUN_NUMBER ))
          echo "版本 1.0.$PATCH (code=$PATCH)"
          gradle :app:assembleRelease \
            -PappVersionName="1.0.$PATCH" \
            -PappVersionCode="$PATCH" \
            --no-daemon --stacktrace

      - name: 收集产物
        run: |
          mkdir -p out
          find SteamEYA-Unified/client/SteamEyaAndroid/app/build/outputs/apk/release -name "*.apk" -exec cp {} out/TeaTT-android.apk \;
          ls -lh out

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TeaTT-android-apk
          path: out/TeaTT-android.apk
          if-no-files-found: error

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PATCH=$(( GITHUB_RUN_NUMBER ))
          TAG="android-v1.0.$PATCH"
          cp out/TeaTT-android.apk "TeaTT-1.0.$PATCH-android.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "TeaTT-1.0.$PATCH-android.apk" --clobber
          else
            gh release create "$TAG" "TeaTT-1.0.$PATCH-android.apk" \
              --title "茶π·次元口袋 安卓 1.0.$PATCH" \
              --notes "安卓客户端构建产物（直接安装 APK）。"
          fi
