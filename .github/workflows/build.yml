name: Build SteamEYA (Windows x64)

# 触发：推送到主分支、PR、或手动点 Run workflow
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # WinUI 3 / Windows App SDK 只能在 Windows 上编译，这里用 GitHub 云端 Windows 机器
    runs-on: windows-latest
    env:
      PROJECT: SteamEYA-Unified/client/SteamEyaWinUI/SteamEyaWinUI.csproj
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: 环境信息
        run: dotnet --info

      # 先做一次普通编译：XAML/C# 有错时能快速失败，不用等 AOT 全程
      - name: Build (Release / x64)
        run: dotnet build "$env:PROJECT" -c Release -p:Platform=x64

      # Native AOT + Windows App SDK 自包含：产物零运行时依赖
      - name: Publish (Native AOT / self-contained)
        run: dotnet publish "$env:PROJECT" -c Release -r win-x64 -p:Platform=x64 -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamEyaWinUI-win-x64
          path: publish/**
          if-no-files-found: error
          retention-days: 14
