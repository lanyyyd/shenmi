name: Build TeaTT (Windows x64)

# 触发：推送到主分支、PR、或手动点 Run workflow
on:
  push:
    branches: [ main, master ]
    # 只在与桌面端相关的路径变化时构建：安卓目录的提交由 android.yml 负责，
    # 不加过滤的话每推一次安卓代码都会白跑一遍 Windows 打包（几分钟 + 一个多余 Release）。
    paths:
      - 'SteamEYA-Unified/client/SteamEyaWinUI/**'
      - 'SteamEYA-Unified/server/**'
      - 'SteamEYA-Unified/web/**'
      - 'SteamEYA-Unified/engine/**'
      - 'SteamEYA-Unified/native/**'
      - 'SteamEYA-Unified/build/**'
      - 'build/installer/**'
      - 'third_party/JiYuTrainer/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'SteamEYA-Unified/client/SteamEyaWinUI/**'
      - 'SteamEYA-Unified/server/**'
      - 'SteamEYA-Unified/web/**'
      - 'SteamEYA-Unified/engine/**'
      - 'SteamEYA-Unified/native/**'
      - 'SteamEYA-Unified/build/**'
      - 'build/installer/**'
      - 'third_party/JiYuTrainer/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# 发布安装包需要写权限：把产物传到 Release（Release 附件不占 Actions 存储配额）
permissions:
  contents: write

jobs:
  build:
    # WinUI 3 / Windows App SDK 只能在 Windows 上编译，这里用 GitHub 云端 Windows 机器
    runs-on: windows-latest
    env:
      PROJECT: SteamEYA-Unified/client/SteamEyaWinUI/SteamEyaWinUI.csproj
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      # 固定英文 UI 文化：XAML 编译器报错时若找不到本地化资源，会把真实错误吞成 WMC9999
      DOTNET_CLI_UI_LANGUAGE: en-US
      VSLANG: '1033'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 极域注入模块（原版 1.7.6 + 菜单修复）----
      # 原版 exe 只在 Hook DLL 不存在时才释放内置副本，所以把这里编译出的
      # JiYuTrainerHooks.dll 随包放到 jiyu 目录即可替换注入模块，exe 保持原版不动。
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build JiYuTrainerHooks (Win32 Release)
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\third_party\JiYuTrainer\out\"
          msbuild "third_party\JiYuTrainer\src\JiYuTrainerHooks\JiYuTrainerHooks.vcxproj" `
            /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 `
            /p:OutDir="$out" /p:IntDir="$out\obj\"
          if ($LASTEXITCODE -ne 0) { throw "JiYuTrainerHooks 编译失败" }
          if (-not (Test-Path "$out\JiYuTrainerHooks.dll")) { throw "JiYuTrainerHooks.dll 未生成" }
          Get-Item "$out\JiYuTrainerHooks.dll" | Select-Object Name, Length

      # 不开 setup-dotnet 的 cache：Windows 上 NuGet 全局包目录单个缓存就有 ~500MB，
      # 已经顶满账号 500MB 的 Actions 存储免费额度（PR 的 merge ref 还会另存一份独立副本），
      # 超配额后 Actions 会被锁停。代价只是每次构建多花约 1 分钟做 restore。
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 环境信息
        run: dotnet --info

      # 先做一次普通编译：XAML/C# 有错时能快速失败，不用等 AOT 全程
      - name: Build (Release / x64)
        id: build
        continue-on-error: true
        run: dotnet build "$env:PROJECT" -c Release -p:Platform=x64

      # XAML 编译器 Pass2 失败时只会抛 WMC9999（信息被吞），真实错误在 output.json 里
      - name: 诊断 · 打印 XAML 编译器 output.json
        if: always()
        shell: pwsh
        run: |
          $projDir = Split-Path $env:PROJECT
          $files = Get-ChildItem -Path "$projDir\obj" -Recurse -Filter output.json -ErrorAction SilentlyContinue
          if ($files) {
            foreach ($f in $files) {
              Write-Host "===== $($f.FullName) ====="
              Get-Content $f.FullName -Raw
            }
          } else {
            Write-Host "未找到 output.json，列出 obj 下全部文件："
            Get-ChildItem -Recurse "$projDir\obj" | Select-Object -ExpandProperty FullName
          }

      - name: 构建失败则终止
        if: steps.build.outcome != 'success'
        shell: pwsh
        run: |
          Write-Error "dotnet build 失败，见上方日志"
          exit 1

      # Native AOT + Windows App SDK 自包含：产物零运行时依赖
      # 注入版本号：使程序集版本与安装包版本一致（客户端「检查更新」靠它比较新旧版本）
      - name: Publish (Native AOT / self-contained)
        shell: pwsh
        run: |
          # 版本从 1.0.0 起：以构建序号偏移，run_number=64 时得到 1.0.0，之后逐次 +1。
          $patch = [Math]::Max(0, ${{ github.run_number }} - 64)
          Write-Host "版本 1.0.$patch"
          dotnet publish "$env:PROJECT" -c Release -r win-x64 -p:Platform=x64 -p:Version=1.0.$patch -o publish

      - name: 清理符号文件（省安装包体积）
        shell: pwsh
        run: Get-ChildItem -Path publish -Filter *.pdb -File -ErrorAction SilentlyContinue | Remove-Item -Force

      # ---- 离线/局域网网关 + 网页聊天前端 ----
      # 客户端在离线模式会拉起本机网关（<安装目录>\gateway\steameya-gateway.exe），
      # 并由网关托管网页版聊天前端（<安装目录>\web）。两者都必须随安装包一起下发。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 构建本机网关（PyInstaller onefile）
        shell: pwsh
        working-directory: SteamEYA-Unified/server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --name steameya-gateway `
            --collect-submodules uvicorn --collect-submodules fastapi `
            --add-data "app;app" --add-data "..\web;web" gateway_main.py
          if (-not (Test-Path "dist\steameya-gateway.exe")) { throw "网关 exe 未生成" }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\publish\gateway" | Out-Null
          Copy-Item "dist\steameya-gateway.exe" "$env:GITHUB_WORKSPACE\publish\gateway\" -Force

      - name: 拷贝网页聊天前端（web → publish\web）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\publish\web" | Out-Null
          Copy-Item "SteamEYA-Unified\web\*" "$env:GITHUB_WORKSPACE\publish\web\" -Recurse -Force
          Get-ChildItem "$env:GITHUB_WORKSPACE\publish\web" | Select-Object -ExpandProperty Name

      # ---- 云游戏引擎（Selenium 本地服务）----
      # 客户端点开「云游戏上号」会拉起 <安装目录>\engine\steameya-engine.exe（见 EngineLauncher），
      # 必须随安装包一起下发，否则页面提示「云游戏引擎未启动」。
      # 入口用 --collect-all selenium：selenium 在代码里是延迟导入，且自带 selenium-manager 二进制，静态分析收集不全。
      - name: 构建云游戏引擎（PyInstaller onefile）
        shell: pwsh
        working-directory: SteamEYA-Unified/engine
        run: |
          python -m pip install -r requirements.txt fastapi "uvicorn[standard]" pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --name steameya-engine `
            --collect-all selenium local_service.py
          if (-not (Test-Path "dist\steameya-engine.exe")) { throw "云游戏引擎 exe 未生成" }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\publish\engine" | Out-Null
          Copy-Item "dist\steameya-engine.exe" "$env:GITHUB_WORKSPACE\publish\engine\" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # ---- 极域助手（内置原版 JiYuTrainer 1.7.6 + 修复版 Hook）----
      # 原版 exe 由 csproj 的 Content 拷到 <安装目录>\jiyu；Hook DLL 在这里补进发布目录。
      # 校验 exe 哈希（确保仍是未修改的原版）和 DLL 里的菜单补丁，防止发布漏拷/被替换。
      - name: 内置极域助手（原版 exe + 修复版 Hook）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish\jiyu | Out-Null
          Copy-Item "third_party\JiYuTrainer\JiYuTrainer.exe" "publish\jiyu\" -Force
          Copy-Item "third_party\JiYuTrainer\out\JiYuTrainerHooks.dll" "publish\jiyu\" -Force

          $exe = "publish\jiyu\JiYuTrainer.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $expected = "03231f35406136a3aa0c41b2e89375451177fe8cb025ed1341443b4bd4c21c7f"
          if ($hash -ne $expected) { throw "内置 JiYuTrainer.exe 哈希不匹配：$hash" }

          $dll = "publish\jiyu\JiYuTrainerHooks.dll"
          $text = [Text.Encoding]::Unicode.GetString([IO.File]::ReadAllBytes($dll))
          if (-not $text.Contains("神秘の魔法武器提供的菜单")) { throw "JiYuTrainerHooks.dll 未包含菜单补丁" }

          Get-ChildItem "publish\jiyu" | Select-Object Name, Length

      # 体积诊断：安装包 50MB+ 时先看清构成，避免盲目裁剪。
      - name: 诊断 · 发布目录体积构成
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path publish)) { Write-Host "publish 目录不存在"; exit 0 }
          $files = Get-ChildItem publish -Recurse -File
          $total = ($files | Measure-Object Length -Sum).Sum
          Write-Host ("===== publish 合计 {0:N1} MB / {1} 个文件 =====" -f ($total/1MB), $files.Count)
          Write-Host ""
          Write-Host "===== 按一级子目录 ====="
          Get-ChildItem publish -Directory | ForEach-Object {
            $s = (Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum
            Write-Host ("{0,-16} {1,9:N2} MB" -f $_.Name, ($s/1MB))
          }
          $rootSum = (Get-ChildItem publish -File | Measure-Object Length -Sum).Sum
          Write-Host ("{0,-16} {1,9:N2} MB" -f "(顶层散装)", ($rootSum/1MB))
          Write-Host ""
          Write-Host "===== 最大的 25 个文件 ====="
          $base = (Get-Location).Path + '\publish\'
          $files | Sort-Object Length -Descending | Select-Object -First 25 | ForEach-Object {
            Write-Host ("{0,9:N2} MB  {1}" -f ($_.Length/1MB), $_.FullName.Replace($base,''))
          }

      # 把 Native AOT 自包含发布目录整体压成单个安装包 exe：用户只需下载/运行这一个文件。
      # 同一份产物打两个包：标准版（内置极域助手）+ 无极域版（剔除 jiyu、带 nojiyu 标记）。
      - name: Package installers (standard + no-JiYu)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            foreach ($c in @(
              (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 7\ISCC.exe"),
              (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe"),
              (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
              (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
            )) { if ($c -and (Test-Path -LiteralPath $c)) { $iscc = $c; break } }
          }
          if (-not $iscc) { throw "ISCC.exe (Inno Setup) 未找到" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $patch = [Math]::Max(0, ${{ github.run_number }} - 64)
          $version = "1.0.$patch"

          # 标准版（内置极域助手）
          & $iscc "/DAppVersion=$version" "/DPublishDir=$env:GITHUB_WORKSPACE\publish" "/DOutputDir=$env:GITHUB_WORKSPACE\artifacts" "/DLanguagesDir=$env:GITHUB_WORKSPACE\build\installer\languages" "/DOutputBaseName=TeaTT-$version-win-x64-setup" "$env:GITHUB_WORKSPACE\build\installer\SteamEYA.iss"
          if ($LASTEXITCODE -ne 0) { throw "标准版 ISCC failed with exit code $LASTEXITCODE" }

          # 无极域版：复制发布目录 → 剔除 jiyu 注入模块 → 放 nojiyu 标记（客户端据此隐藏「小工具」、更新只走 GitHub）
          $noJiyuDir = "$env:GITHUB_WORKSPACE\publish-nojiyu"
          if (Test-Path $noJiyuDir) { Remove-Item $noJiyuDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $noJiyuDir | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\publish\*" $noJiyuDir -Recurse -Force
          Remove-Item "$noJiyuDir\jiyu" -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path "$noJiyuDir\jiyu") { throw "无极域版仍残留 jiyu 目录" }
          New-Item -ItemType File -Force -Path "$noJiyuDir\nojiyu" | Out-Null

          & $iscc "/DAppVersion=$version" "/DPublishDir=$noJiyuDir" "/DOutputDir=$env:GITHUB_WORKSPACE\artifacts" "/DLanguagesDir=$env:GITHUB_WORKSPACE\build\installer\languages" "/DOutputBaseName=TeaTT-$version-win-x64-nojiyu-setup" "/DNoJiYu=1" "$env:GITHUB_WORKSPACE\build\installer\SteamEYA.iss"
          if ($LASTEXITCODE -ne 0) { throw "无极域版 ISCC failed with exit code $LASTEXITCODE" }

          Get-ChildItem artifacts

      # 安装包传到 GitHub Release 而不是 Actions artifact：
      # Release 附件不占用 500MB 的 Actions 存储配额，避免再次触发
      # “Artifact storage quota has been hit”导致整个构建失败。
      - name: Publish installer to GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $patch = [Math]::Max(0, ${{ github.run_number }} - 64)
          $tag = "v1.0.$patch"
          $exes = @(Get-ChildItem artifacts/*.exe)
          if ($exes.Count -lt 2) { throw "安装包不全（期望标准版 + 无极域版，实际 $($exes.Count) 个）" }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "茶π·次元口袋 $tag" --notes "自动构建 ${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败" }
          }
          gh release upload $tag $exes.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传安装包到 Release 失败" }
          Write-Host "Release: https://github.com/${{ github.repository }}/releases/tag/$tag"

      # 便携包 ~83MB，与 setup.exe 内容重复，只在手动触发时打包上传，
      # 同样走 Release 附件，不占 Actions 存储额度。
      - name: Package portable zip
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath artifacts/SteamEyaWinUI-win-x64-portable.zip -Force
          if (-not (Test-Path artifacts/SteamEyaWinUI-win-x64-portable.zip)) { throw "便携包未生成" }

      - name: Publish portable to GitHub Release (manual only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $patch = [Math]::Max(0, ${{ github.run_number }} - 64)
          $tag = "v1.0.$patch"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "茶π·次元口袋 $tag" --notes "自动构建 ${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败" }
          }
          gh release upload $tag artifacts/SteamEyaWinUI-win-x64-portable.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传便携包到 Release 失败" }
