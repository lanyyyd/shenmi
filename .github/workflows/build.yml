name: Build SteamEYA (Windows x64)

# 触发：推送到主分支、PR、或手动点 Run workflow
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # WinUI 3 / Windows App SDK 只能在 Windows 上编译，这里用 GitHub 云端 Windows 机器
    runs-on: windows-latest
    env:
      PROJECT: SteamEYA-Unified/client/SteamEyaWinUI/SteamEyaWinUI.csproj
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      # 固定英文 UI 文化：XAML 编译器报错时若找不到本地化资源，会把真实错误吞成 WMC9999
      DOTNET_CLI_UI_LANGUAGE: en-US
      VSLANG: '1033'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: 环境信息
        run: dotnet --info

      # 先做一次普通编译：XAML/C# 有错时能快速失败，不用等 AOT 全程
      # UseXamlCompilerExecutable=false：dotnet CLI 默认会调用 net472 的 XamlCompiler.exe，
      # 该 exe 在报错时找不到自身错误消息资源，把真实错误吞成 WMC9999；改用进程内编译器可拿到真实错误。
      - name: Build (Release / x64)
        id: build
        continue-on-error: true
        run: dotnet build "$env:PROJECT" -c Release -p:Platform=x64 -p:UseXamlCompilerExecutable=false

      # XAML 编译器 Pass2 失败时只会抛 WMC9999（信息被吞），真实错误在 output.json 里
      - name: 诊断 · 打印 XAML 编译器 output.json
        if: always()
        shell: pwsh
        run: |
          $projDir = Split-Path $env:PROJECT
          $files = Get-ChildItem -Path "$projDir\obj" -Recurse -Filter output.json -ErrorAction SilentlyContinue
          if ($files) {
            foreach ($f in $files) {
              Write-Host "===== $($f.FullName) ====="
              Get-Content $f.FullName -Raw
            }
          } else {
            Write-Host "未找到 output.json，列出 obj 下全部文件："
            Get-ChildItem -Recurse "$projDir\obj" | Select-Object -ExpandProperty FullName
          }

      - name: 构建失败则终止
        if: steps.build.outcome != 'success'
        shell: pwsh
        run: |
          Write-Error "dotnet build 失败，见上方日志"
          exit 1

      # Native AOT + Windows App SDK 自包含：产物零运行时依赖
      - name: Publish (Native AOT / self-contained)
        run: dotnet publish "$env:PROJECT" -c Release -r win-x64 -p:Platform=x64 -p:UseXamlCompilerExecutable=false -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamEyaWinUI-win-x64
          path: publish/**
          if-no-files-found: error
          retention-days: 14
